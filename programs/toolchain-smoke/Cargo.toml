# Throwaway program for Phase 0: proves the pinned toolchain end to end
# (build, feature set, emit_cpi, SlotHashes, PDA-as-payer, ORAO CPI). Deleted
# once the real program exists; its tests are retargeted.
[package]
name = "toolchain-smoke"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "toolchain_smoke"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }

[dev-dependencies]
fade-testkit = { path = "../../crates/fade-testkit" }
mollusk-svm = { workspace = true }
litesvm = { workspace = true }
agave-feature-set = { workspace = true }
solana-address = { workspace = true }
solana-account = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
solana-message = { workspace = true }
solana-sdk-ids = { workspace = true }
