<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 320" width="870" height="320" font-family="Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5e6c84"/></marker></defs><rect width="870" height="320" fill="#ffffff"/><g fill="none" stroke="#5e6c84" stroke-width="1.5" marker-end="url(#a)"><path d="M18 172 H858"/><path d="M115.5 126 V169" marker-end="none"/><path d="M328.5 126 V169" marker-end="none"/><path d="M541.5 126 V169" marker-end="none"/><path d="M754.5 126 V169" marker-end="none"/></g><rect x="18" y="30" width="195" height="96" rx="8" fill="#DEEBFF" stroke="#4C9AFF"/><rect x="231" y="30" width="195" height="96" rx="8" fill="#FFFAE6" stroke="#FFC400"/><rect x="444" y="30" width="195" height="96" rx="8" fill="#DEEBFF" stroke="#4C9AFF"/><rect x="657" y="30" width="195" height="96" rx="8" fill="#E3FCEF" stroke="#57D9A3"/><rect x="18" y="222" width="834" height="80" rx="8" fill="#F4F5F7" stroke="#B3BAC5"/><g font-size="10" fill="#5e6c84" text-anchor="middle"><text x="115.5" y="64" font-size="13" fill="#172b4d" font-weight="600">open_ticket</text><text x="115.5" y="79" font-size="9.5">slot t</text><text x="115.5" y="91" font-size="9.5">payout table, margin, shares frozen</text><text x="115.5" y="103" font-size="9.5">ticket price escrowed</text><text x="328.5" y="64" font-size="13" fill="#172b4d" font-weight="600">the next block</text><text x="328.5" y="79" font-size="9.5">slot s* = first slot after t</text><text x="328.5" y="91" font-size="9.5">h* = its hash in SlotHashes</text><text x="328.5" y="103" font-size="9.5">did not exist at open</text><text x="541.5" y="64" font-size="13" fill="#172b4d" font-weight="600">request_randomness</text><text x="541.5" y="79" font-size="9.5">seed = SHA256(tag, program,</text><text x="541.5" y="91" font-size="9.5">ticket, t, s*, h*)</text><text x="541.5" y="103" font-size="9.5">any caller, t+2 … t+150</text><text x="754.5" y="58" font-size="13" fill="#172b4d" font-weight="600">settle_ticket</text><text x="754.5" y="73" font-size="9.5">ORAO has written R</text><text x="754.5" y="85" font-size="9.5">d = SHA256(tag, program, ticket,</text><text x="754.5" y="97" font-size="9.5">seed, R, i)</text><text x="754.5" y="109" font-size="9.5">rejection-sampled outcome</text><text x="115.5" y="192" font-size="10.5" fill="#172b4d" font-family="monospace">t</text><text x="328.5" y="192" font-size="10.5" fill="#172b4d" font-family="monospace">s*  &gt;  t</text><text x="541.5" y="192" font-size="10.5" fill="#172b4d" font-family="monospace">c,  t+2 ≤ c ≤ t+150</text><text x="754.5" y="192" font-size="10.5" fill="#172b4d" font-family="monospace">fulfilled, then settled</text><text x="435" y="254" font-size="12" fill="#172b4d" font-weight="600">Why nobody can know the seed when the ticket opens</text><text x="435" y="269">At slot t the hash h* has not been produced yet, so neither the player nor ORAO's key holders can compute the seed.</text><text x="435" y="281">Biasing one outcome now takes ORAO's key holders, the leader of slot s* and the player, acting together.</text></g></svg>