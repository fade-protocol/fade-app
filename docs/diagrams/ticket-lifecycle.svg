<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 320" width="890" height="320" font-family="Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5e6c84"/></marker></defs><rect width="890" height="320" fill="#ffffff"/><g fill="none" stroke="#5e6c84" stroke-width="1.5" marker-end="url(#a)"><path d="M150 72 H254"/><path d="M390 72 H494"/><path d="M630 72 H734"/><path d="M85 24 V39"/><path d="M325 100 V184"/><path d="M85 100 V218 H249"/></g><rect x="20" y="44" width="130" height="56" rx="8" fill="#DEEBFF" stroke="#4C9AFF"/><rect x="260" y="44" width="130" height="56" rx="8" fill="#DEEBFF" stroke="#4C9AFF"/><rect x="500" y="44" width="130" height="56" rx="8" fill="#DEEBFF" stroke="#4C9AFF" stroke-dasharray="5 3"/><rect x="740" y="44" width="130" height="56" rx="8" fill="#E3FCEF" stroke="#57D9A3"/><rect x="255" y="190" width="140" height="56" rx="8" fill="#FFEBE6" stroke="#FF8F73"/><g font-size="10" fill="#5e6c84" text-anchor="middle"><text x="85" y="70" font-size="13" fill="#172b4d" font-weight="600">OPEN</text><text x="85" y="85" font-size="9.5">ticket price escrowed</text><text x="325" y="70" font-size="13" fill="#172b4d" font-weight="600">REQUESTED</text><text x="325" y="85" font-size="9.5">seed from a later block</text><text x="565" y="70" font-size="13" fill="#172b4d" font-weight="600">FULFILLED</text><text x="565" y="85" font-size="9.5">ORAO account filled</text><text x="805" y="70" font-size="13" fill="#172b4d" font-weight="600">SETTLED</text><text x="805" y="85" font-size="9.5">paid in full</text><text x="325" y="216" font-size="13" fill="#172b4d" font-weight="600">EXPIRED</text><text x="325" y="231" font-size="9.5">ticket price forfeited to the vault</text><text x="205" y="60">request_randomness</text><text x="205" y="92" font-size="9">any caller · 50k lamports</text><text x="445" y="60">the ORAO quorum</text><text x="445" y="92" font-size="9">writes the proof</text><text x="685" y="60">settle_ticket</text><text x="685" y="92" font-size="9">any caller · no deadline</text><text x="85" y="18">open_ticket · signed · slot t</text><text x="170" y="211">no proof by t + 150 slots</text><text x="333" y="160" text-anchor="start">no proof by t + 150 slots</text><text x="20" y="272" font-size="10.5" text-anchor="start">Every transition after open_ticket is permissionless and paid out of the crank fee prepaid at open. Dashed: FULFILLED is the</text><text x="20" y="288" font-size="10.5" text-anchor="start">oracle's account state, not a state of the ticket. Once it holds, only settle_ticket applies, with no deadline; T_SETTLE bounds</text><text x="20" y="304" font-size="10.5" text-anchor="start">how long Fade waits for randomness, never how long anyone has to settle — a deadline there would strand fulfilled tickets.</text></g></svg>