<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 300" width="870" height="300" font-family="Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5e6c84"/></marker></defs><rect width="870" height="300" fill="#ffffff"/><g fill="none" stroke="#5e6c84" stroke-width="1.5" marker-end="url(#a)"><path d="M255 86 H309"/><path d="M555 86 H609"/></g><rect x="15" y="34" width="240" height="104" rx="8" fill="#EAE6FF" stroke="#998DD9"/><rect x="315" y="34" width="240" height="104" rx="8" fill="#DEEBFF" stroke="#4C9AFF"/><rect x="615" y="34" width="240" height="104" rx="8" fill="#E3FCEF" stroke="#57D9A3"/><rect x="15" y="208" width="260" height="72" rx="8" fill="#FFEBE6" stroke="#FF8F73"/><rect x="305" y="208" width="260" height="72" rx="8" fill="#FFEBE6" stroke="#FF8F73"/><rect x="595" y="208" width="260" height="72" rx="8" fill="#FFEBE6" stroke="#FF8F73"/><g font-size="10" fill="#5e6c84" text-anchor="middle"><text x="135" y="78" font-size="13" fill="#172b4d" font-weight="600">Integrator</text><text x="135" y="93" font-size="9.5">a program, a server or a wallet</text><text x="135" y="105" font-size="9.5">owns the game and the players</text><text x="435" y="72" font-size="13" fill="#172b4d" font-weight="600">Signature</text><text x="435" y="87" font-size="9.5">program: PDA ["fade-integrator"]</text><text x="435" y="99" font-size="9.5">invoke_signed: only it can sign</text><text x="435" y="111" font-size="9.5">server or wallet: its own key</text><text x="735" y="72" font-size="13" fill="#172b4d" font-weight="600">Fade records</text><text x="735" y="87" font-size="9.5">identity = the signing address</text><text x="735" y="99" font-size="9.5">record ["integrator", signer]</text><text x="735" y="111" font-size="9.5">created by the first ticket</text><text x="285" y="78">signs</text><text x="585" y="78">open_ticket</text><text x="435" y="170" font-size="11.5" fill="#172b4d" font-weight="600">Identity is the signing address — no registration, no deposit, no allowlist</text><text x="435" y="196" font-size="10.5" fill="#bf2600">Rejected ways to identify the caller</text><text x="145" y="236" font-size="12" fill="#172b4d" font-weight="600">ctx.program_id</text><text x="145" y="251" font-size="9.5">is Fade's own id</text><text x="145" y="263" font-size="9.5">says nothing about the caller</text><text x="435" y="236" font-size="12" fill="#172b4d" font-weight="600">instructions sysvar</text><text x="435" y="251" font-size="9.5">sees top-level instructions only</text><text x="435" y="263" font-size="9.5">the CPI frame is invisible to it</text><text x="725" y="236" font-size="12" fill="#172b4d" font-weight="600">an identity as an argument</text><text x="725" y="251" font-size="9.5">anyone can fill it in</text><text x="725" y="263" font-size="9.5">the caller can claim to be anyone</text></g></svg>