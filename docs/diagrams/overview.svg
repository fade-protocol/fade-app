<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5e6c84"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><g fill="none" stroke="#5e6c84" stroke-width="1.5" marker-end="url(#a)"><path d="M155 72 H234"/><path d="M400 72 H479"/><path d="M675 50 H754"/><path d="M760 78 H681"/><path d="M760 208 H681"/><path d="M400 212 H479"/><path d="M485 236 H406"/><path d="M500 255 V296 H85 V110" stroke-dasharray="4 3"/></g><rect x="15" y="40" width="140" height="64" rx="8" fill="#F4F5F7" stroke="#B3BAC5"/><rect x="240" y="40" width="160" height="64" rx="8" fill="#EAE6FF" stroke="#998DD9"/><rect x="485" y="25" width="190" height="230" rx="8" fill="#DEEBFF" stroke="#4C9AFF"/><rect x="760" y="30" width="125" height="64" rx="8" fill="#FFFAE6" stroke="#FFC400"/><rect x="760" y="176" width="125" height="64" rx="8" fill="#F4F5F7" stroke="#B3BAC5"/><rect x="240" y="190" width="160" height="64" rx="8" fill="#E3FCEF" stroke="#57D9A3"/><g font-size="10" fill="#5e6c84" text-anchor="middle"><text x="85" y="70" font-size="13" fill="#172b4d" font-weight="600">Buyer</text><text x="85" y="85" font-size="9.5">plays via an integrator</text><text x="320" y="64" font-size="13" fill="#172b4d" font-weight="600">Integrator</text><text x="320" y="79" font-size="9.5">program, server or wallet</text><text x="320" y="91" font-size="9.5">brings game and players</text><text x="580" y="120" font-size="17" fill="#172b4d" font-weight="600">Fade</text><text x="580" y="135" font-size="10.5">payout table invariant</text><text x="580" y="147" font-size="10.5">caps and breakers</text><text x="580" y="159" font-size="10.5">ticket state machine</text><text x="580" y="171" font-size="10.5">USDC vault, epoch pricing</text><text x="822.5" y="60" font-size="13" fill="#172b4d" font-weight="600">ORAO VRF</text><text x="822.5" y="75" font-size="9.5">3-of-3 quorum</text><text x="822.5" y="206" font-size="13" fill="#172b4d" font-weight="600">Crankers</text><text x="822.5" y="221" font-size="9.5">anyone, paid per call</text><text x="320" y="214" font-size="13" fill="#172b4d" font-weight="600">Liquidity providers</text><text x="320" y="229" font-size="9.5">carry the variance</text><text x="320" y="241" font-size="9.5">earn the margin</text><text x="197.5" y="64">plays</text><text x="442.5" y="62">open_ticket</text><text x="442.5" y="90" font-size="9.5">signed call</text><text x="717.5" y="42">request</text><text x="717.5" y="94">proof</text><text x="717.5" y="200" font-size="9.5">request, settle</text><text x="717.5" y="224" font-size="9.5">expire</text><text x="442.5" y="204" font-size="9.5">request_deposit</text><text x="442.5" y="252" font-size="9.5">request_withdraw</text><text x="290" y="290">payout, exactly as the stored payout table says</text><text x="450" y="322" font-size="11">Fade owns solvency, fairness and randomness. The integrator owns the game, the interface and the players.</text></g></svg>