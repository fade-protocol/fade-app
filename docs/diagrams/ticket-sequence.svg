" font-size="12.5" fill="#172b4d" font-weight="600">Fade</text><text x="690" y="37" font-size="12.5" fill="#172b4d" font-weight="600">ORAO</text><text x="850" y="37" font-size="12.5" fill="#172b4d" font-weight="600">Cranker</text><text x="152.5" y="82" font-size="9.5" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">play</text><text x="347.5" y="113" font-size="9.5" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">open_ticket · integrator-signed · slot t</text><text x="460" y="152" font-size="9.5" fill="#172b4d">checks · escrow · reserve · freeze the rules · prefund the oracle fee</text><text x="347.5" y="175" font-size="9.5" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ticket account (payout table public, no seed yet)</text><text x="655" y="206" font-size="9.5" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">request_randomness · slot ≥ t+2</text><text x="460" y="245" font-size="9.5" fill="#172b4d">seed = SHA256(tag, program, ticket, t, s*, h*)</text><text x="575" y="268" font-size="9.5" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">request_v2(seed)</text><text x="575" y="299" font-size="9.5" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">quorum writes R</text><text x="655" y="330" font-size="9.5" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">settle_ticket · no deadline</text><text x="460" y="369" font-size="9.5" fill="#172b4d">d = SHA256(tag, program, ticket, seed, R, i) → outcome</text><text x="265" y="392" font-size="9.5" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">payout, exactly as the frozen payout table says</text><text x="655" y="423" font-size="9.5" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">crank fees: 50k to the requester, 200k to the settler</text><text x="460" y="476" font-size="10.5">Dashed arrows are returns. Everything after open_ticket is permissionless: the cranker is whoever calls first.</text></g></svg>