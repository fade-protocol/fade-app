<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 330" width="870" height="330" font-family="Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5e6c84"/></marker></defs><rect width="870" height="330" fill="#ffffff"/><g fill="none" stroke="#5e6c84" stroke-width="1.5" marker-end="url(#a)"><path d="M245 95 H314"/><path d="M550 95 H619"/></g><rect x="15" y="40" width="230" height="110" rx="8" fill="#DEEBFF" stroke="#4C9AFF"/><rect x="320" y="40" width="230" height="110" rx="8" fill="#FFFAE6" stroke="#FFC400"/><rect x="625" y="40" width="230" height="110" rx="8" fill="#E3FCEF" stroke="#57D9A3"/><rect x="15" y="210" width="260" height="62" rx="8" fill="#DEEBFF" stroke="#4C9AFF"/><rect x="305" y="210" width="260" height="62" rx="8" fill="#FFFAE6" stroke="#FFC400"/><rect x="595" y="210" width="260" height="62" rx="8" fill="#F4F5F7" stroke="#B3BAC5"/><g font-size="10" fill="#5e6c84" text-anchor="middle"><text x="130" y="69" font-size="13" fill="#172b4d" font-weight="600">1 · request, the LP's one move</text><text x="130" y="84" font-size="9.5">deposit → USDC to deposit_queue_usdc</text><text x="130" y="96" font-size="9.5">withdraw → shares to share_escrow</text><text x="130" y="108" font-size="9.5">joins the epoch that is filling</text><text x="130" y="120" font-size="9.5">prepays CLAIM_FEE in SOL</text><text x="130" y="132" font-size="9.5">neither is priced yet</text><text x="435" y="69" font-size="13" fill="#172b4d" font-weight="600">2 · strike_epoch, by a keeper</text><text x="435" y="84" font-size="9.5">one price for the whole batch</text><text x="435" y="96" font-size="9.5">once the close has passed and</text><text x="435" y="108" font-size="9.5">every earlier ticket is closed</text><text x="435" y="120" font-size="9.5">bulk moves, constant time</text><text x="435" y="132" font-size="9.5">flat STRIKE_REWARD from the fund</text><text x="740" y="69" font-size="13" fill="#172b4d" font-weight="600">3 · claim, by a keeper</text><text x="740" y="84" font-size="9.5">claim_deposit / claim_withdraw</text><text x="740" y="96" font-size="9.5">shares or USDC to the owner</text><text x="740" y="108" font-size="9.5">paid by the request's CLAIM_FEE</text><text x="740" y="120" font-size="9.5">rationed withdrawal: one claim</text><text x="740" y="132" font-size="9.5">closes the request, refunds rent</text><text x="282.5" y="85" font-size="9.5">epoch closes</text><text x="282.5" y="115" font-size="9.5">at :00, :10, :20</text><text x="587.5" y="85" font-size="9.5">minutes later</text><text x="587.5" y="115" font-size="9.5">price is fixed</text><text x="435" y="196" font-size="11.5" fill="#172b4d" font-weight="600">Three separate USDC accounts — each backs one ledger figure an auditor checks</text><text x="145" y="239" font-size="13" fill="#172b4d" font-weight="600">vault_usdc  ≥  total_assets</text><text x="145" y="254" font-size="9.5">the vault side: backs every open ticket</text><text x="435" y="239" font-size="13" fill="#172b4d" font-weight="600">deposit_queue_usdc</text><text x="435" y="254" font-size="9.5">queued cash: not an asset yet</text><text x="725" y="239" font-size="13" fill="#172b4d" font-weight="600">payable_usdc</text><text x="725" y="254" font-size="9.5">struck, not yet claimed: no longer an asset</text><text x="435" y="304" font-size="12" fill="#172b4d" font-family="monospace">tickets never touch the queue side  ·  only the strike moves USDC between the sides</text></g></svg>