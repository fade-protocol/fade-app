[workspace]
members = ["programs/*", "crates/*", "tests/programs/*"]
# fuzz/ is its own cargo-fuzz workspace, built on a nightly toolchain
# (scripts/fuzz-settle-layout.sh), so it stays out of this workspace.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fade-protocol/fade-app"

[workspace.dependencies]
anchor-lang = { version = "=1.2.0", features = ["event-cpi"] }
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "mint", "token_2022", "token_2022_extensions", "associated_token"] }  # what the init mint/token constraints expand to; no "metadata" (mpl)
solana-sha256-hasher = { version = "3", features = ["sha2"] }
solana-instructions-sysvar = "3"

# Test harnesses. Versions are the ones the resolver unifies for mollusk 0.15.1
# and litesvm 0.16.0 (both on the Agave 4.2 runtime crates); anchor-lang 1.2 sits
# on the solana 3.x interface crates and its Pubkey re-exports solana-address 2.x.
mollusk-svm = { version = "=0.15.1", features = ["inner-instructions"] }
litesvm = "=0.16.0"
agave-feature-set = "4.2"
solana-address = "2.6"
solana-account = "4.3"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = "4.1"
solana-message = "4.4"
solana-address-lookup-table-interface = { version = "3.1", features = ["bincode", "bytemuck"] }
solana-sdk-ids = "3"
solana-clock = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Money code: every overflow is a bug, in release too.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
