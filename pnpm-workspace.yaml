packages:
  - "."
  - "apps/*"

# Install scripts stay off. Reown's are a version-check notice and optional
# native speedups for Node (bigint-buffer, bufferutil, utf-8-validate) that the
# browser bundle never uses; each falls back to pure JS.
allowBuilds:
  "@reown/appkit": false
  bigint-buffer: false
  bufferutil: false
  esbuild: false
  utf-8-validate: false
# Supply-chain cooldown: a package must be at least 7 days old to be installed,
# long enough for a compromised or broken release to be found and pulled.
minimumReleaseAge: 10080

# Transitive pins for advisories. jayson (through @solana/web3.js v1, which
# Reown's Solana adapter requires) uses uuid's v4 only; 11.1.1 closes the
# v3/v5/v6 buffer bounds advisory and keeps v4's API.
overrides:
  "jayson>uuid": "11.1.1"
